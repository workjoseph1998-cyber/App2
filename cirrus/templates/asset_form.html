{% extends "base.html" %}
{% block content %}
    <div class="eyebrow">ASSETPASS / INVENTORY</div>
    <h1>Register equipment</h1>
    <p>New assets start as Available. Use a handover to assign them.</p>
    <form method="post" class="panel form-grid">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label>
            Unique asset ID<input name="asset_tag" required maxlength="100">
        </label>
        <label>
            Category<select name="category">
            {% for c in asset_categories %}
                <option>{{ c }}</option>
            {% endfor %}
            </select>
        </label>
        {% for field in ['manufacturer','model','serial','supplier','location'] %}
            <label>
                {{ field|title }}<input name="{{ field }}" maxlength="200">
            </label>
        {% endfor %}
        <label>
            Condition<input name="condition" required placeholder="New / Good / Fair">
        </label>
        <label>
            Purchase date<input type="date" name="purchase_date">
        </label>
        <label>
            Purchase cost<input type="number" name="purchase_cost" min="0" step="0.01">
        </label>
        <label>
            Warranty expiration<input type="date" name="warranty_expiration">
        </label>
        <label class="full">
            Description<textarea name="description">
</textarea>
        </label>
        <label class="full">
            Notes<textarea name="notes">
</textarea>
        </label>
        <div class="full">
            <button>Register asset</button>
        </div>
    </form>
{% endblock %}
