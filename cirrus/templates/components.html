{% macro nav(href,label,icon) %}<a class="nav-item {{'active' if request.path==href}}" href="{{request.script_root}}{{href}}" {{'aria-current=page' if request.path==href}}><span class="nav-icon" data-ui-icon="{{icon}}" aria-hidden="true"></span><span>{{label}}</span>{% if href=='/notifications' %}<span id="nav-notification-count"></span>{% endif %}{% if request.path==href %}<span class="nav-active-dot"></span>{% endif %}</a>{% endmacro %}
{% macro orbit() %}<div class="orbit-art" aria-hidden="true"><div class="orbit-glow"></div><div class="orbit-ring ring-a"></div><div class="orbit-ring ring-b"></div><div class="orbit-ring ring-c"></div><div class="orbit-core"><span class="core-cross"></span></div><div class="satellite s-a"></div><div class="satellite s-b"></div><div class="orbit-line line-a"></div><div class="orbit-line line-b"></div><span class="orbit-caption">CONNECTED BY DESIGN</span><span class="orbit-coordinate">C / 02 — OPERATIONS</span></div>{% endmacro %}
