{% extends "base.html" %}
{% block content %}
    <div class="eyebrow">ADMINISTRATION</div>
    <h1>Users & roles</h1>
    <details class="panel">
        <summary>Create account</summary>
        <form method="post" class="form-grid">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <label>
                Username<input name="username" required>
            </label>
            <label>
                Display name<input name="name" required>
            </label>
            <label>
                Password<input name="password"
                               type="password"
                               minlength="12"
                               required
                               autocomplete="new-password">
            </label>
            <label>
                Role<select name="role">
                {% for r in roles %}
                    <option>{{ r }}</option>
                {% endfor %}
                </select>
            </label>
            <label>
                Department<select name="department_id">
                <option value="">None</option>
                {% for d in departments %}
                    <option value="{{ d.id }}">{{ d.name }}</option>
                {% endfor %}
                </select>
            </label>
            <button>Create account</button>
        </form>
    </details>
    {% for u in items %}
        <details class="panel">
            <summary>{{ u.name }} · {{ u.username }} · {{ u.role }} · {{'Enabled' if u.enabled else 'Disabled'}}</summary>
            <form method="post" class="form-grid">
                <input type="hidden" name="csrf" value="{{ csrf }}">
                <input type="hidden" name="id" value="{{ u.id }}">
                <label>
                    Name<input name="name" value="{{ u.name }}" required>
                </label>
                <label>
                    Role<select name="role">
                    {% for r in roles %}
                        <option {{'selected' if u.role==r}}>{{ r }}</option>
                    {% endfor %}
                    </select>
                </label>
                <label>
                    Department<select name="department_id">
                    <option value="">None</option>
                    {% for d in departments %}
                        <option value="{{ d.id }}" {{'selected' if d.id==u.department_id}}>{{ d.name }}</option>
                    {% endfor %}
                    </select>
                </label>
                <label>
                    Reset password (blank keeps current)<input name="password"
                                                               type="password"
                                                               minlength="12"
                                                               autocomplete="new-password">
                </label>
                <label class="check">
                    <input name="enabled" type="checkbox" {{'checked' if u.enabled}}>Enabled
                </label>
                <button>Save account</button>
            </form>
        </details>
    {% endfor %}
{% endblock %}
